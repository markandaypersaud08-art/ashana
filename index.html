<!DOCTYPE html>
<html>
<head>
    <title>For Ashana 💕</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1b1b2f, #3a0a2d); /* dark love theme */
            font-family: 'Segoe Script', cursive;
            text-align: center;
            overflow: hidden;
            color: #ffb6c1;
            flex-direction: column;
        }

        img.gif-header {
            width: 200px;
            height: auto;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 0 20px #ff69b4;
        }

        h1 {
            font-size: 40px;
            color: #ffb6c1;
            text-shadow: 2px 2px 10px #ff69b4;
        }

        button {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 20px;
            border: none;
            border-radius: 50px;
            background: #ff69b4; /* dark love button */
            color: white;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(255,105,180,0.7);
        }

        button:hover {
            transform: scale(1.1);
            background: #ff4d6d;
        }

        .heart {
            position: absolute;
            color: #ff69b4; /* heart color matches theme */
            font-size: 20px;
            animation: float 6s infinite;
        }

        small {
            font-size: 15px;
            color: #ffc0cb;
        }

        @keyframes float {
            0% { transform: translateY(100vh); opacity: 1; }
            100% { transform: translateY(-10vh); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Bear3.gif header -->
    <img src="Bear3.gif" alt="Cute Bear" class="gif-header">

    <div>
        <h1>Heyyyy Miss 💖<br>Do you want to see a surprise? 🥹<br> <small>As You Can See There Isn't Any No Buttons This Time 🫣🫣</small></h1>
        <button onclick="location.href='question.html'">Yes 💕</button>
    </div>

    <script>
        // Floating hearts
        setInterval(() => {
            let heart = document.createElement("div");
            heart.innerHTML = "💗";
            heart.className = "heart";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = Math.random() * 20 + 20 + "px";
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }, 500);
    </script>

</body>
</html>
