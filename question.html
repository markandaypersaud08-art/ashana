<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Ashana</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #1b1b2f, #3a0a2d);
      color: #ffb6c1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin: 1rem 0;
    }

    img {
      width: 200px;
      height: auto;
      margin-bottom: 1rem;
      border-radius: 15px;
      box-shadow: 0 0 20px #ff69b4;
    }

    button {
      background: #ff69b4;
      border: none;
      padding: 1rem 2rem;
      font-size: 1.2rem;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <img src="Bear.gif" alt="Cute Bear">
  <h1>But first Ashana, Do you want to know how beautiful i think you are?</h1>
  <br>
  <button onclick="goToMeasure()">Show Me</button>

  <script>
    function goToMeasure() {
      window.location.href = "measure.html";
    }
  </script>
</body>
</html>
